# Sommelier on Unraid — deployment compose.
#
# This file PULLS pre-built images; it never builds. The NAS therefore needs no
# source checkout, no Go and no Node. Build and push from a workstation with the
# repo's own compose.yaml, then `docker compose pull && docker compose up -d`
# here.
#
# Only two files belong on the server: this one and .env beside it.
name: sommelier

services:
  # Refreshes the mirror on a schedule and publishes a read-only-safe copy.
  # The only service that writes the data directory.
  sync:
    image: ghcr.io/kekzim/bolagetdb-sync:${IMAGE_TAG:-latest}
    container_name: sommelier-sync
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      # Weekly, Friday evening. Releases land Thursday and Friday and are
      # pre-announced ~17 days out, so a weekly run sees the coming fortnight.
      # Move to Thursday morning if you care most about web allocations --
      # every one of those lands on a Thursday.
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 19 * * 5}
      SYNC_STORES: ${SYNC_STORES:-1001 1002}
    volumes:
      # Bind mount rather than a named volume, so Unraid's appdata backup covers
      # it. Rebuilding the mirror from scratch costs ~25 minutes.
      - ${APPDATA:-/mnt/user/appdata/sommelier}:/data
    networks: [egress]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mcp:
    image: ghcr.io/kekzim/systembolaget-mcp-server:${IMAGE_TAG:-latest}
    container_name: sommelier-mcp
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8848
      BOLAGETDB_PATH: /data/bolaget.db
      # Required. Without it the server accepts unauthenticated requests.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      # Optional: only live shelf-stock checks need it.
      SYSTEMBOLAGET_API_KEY: ${SYSTEMBOLAGET_API_KEY:-}
    ports:
      # Bind to the Unraid LAN address, not 0.0.0.0 -- until the tunnel is in
      # place (Phase 02) this should be reachable on the LAN and nowhere else.
      - "${BIND_ADDR:?set BIND_ADDR to the Unraid LAN address in .env}:${HOST_PORT:-8848}:8848"
    volumes:
      # Read-only. The published database is in rollback-journal mode precisely
      # so this works -- a WAL database cannot be opened from a read-only mount.
      - ${APPDATA:-/mnt/user/appdata/sommelier}:/data:ro
    networks: [egress]
    depends_on:
      # Ordering only. The server starts without a mirror and reports the
      # problem through /health rather than crash-looping.
      - sync
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Both need outbound access: sync pulls the assortment, the MCP server checks
  # live shelf stock.
  egress:
    driver: bridge
